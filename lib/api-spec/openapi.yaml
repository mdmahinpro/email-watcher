openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Single-password access gate
  - name: accounts
    description: Email account management (IMAP/SMTP)
  - name: messages
    description: Matched messages
  - name: inbox
    description: Unfiltered mailbox archive
  - name: settings
    description: Application settings (keywords, forwarding)
  - name: stats
    description: Dashboard statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Whether the caller holds a valid session
      description: >-
        Unauthenticated: used by the frontend on load to decide between the login
        screen and the app. Never returns 401.
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange the app password for a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Signed in; a session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Wrong password
        "429":
          description: Too many attempts
        "503":
          description: No password configured on the server
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Clear the session cookie
      responses:
        "204":
          description: Signed out

  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List all configured email accounts
      parameters:
        - name: provider
          in: query
          required: false
          description: Only return accounts created for this provider.
          schema:
            $ref: "#/components/schemas/AccountProvider"
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailAccount"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Add a new email account (IMAP + SMTP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountBody"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAccount"
  /accounts/bulk:
    post:
      operationId: createAccountsBulk
      tags: [accounts]
      summary: Add several accounts, deriving each server from its own domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreateAccountsBody"
      responses:
        "200":
          description: Per-address outcome. Individual failures do not fail the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCreateResult"
  /accounts/hostinger:
    post:
      operationId: createHostingerAccounts
      tags: [accounts]
      summary: Add Hostinger mailboxes using Hostinger's server defaults
      description: >-
        Server settings are filled in from Hostinger's published configuration,
        so the request only carries mailboxes and passwords. Each mailbox may
        supply its own password, or omit it to use the shared `password`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHostingerAccountsBody"
      responses:
        "200":
          description: Per-mailbox outcome. Individual failures do not fail the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCreateResult"
  /accounts/hostinger/defaults:
    get:
      operationId: getHostingerDefaults
      tags: [accounts]
      summary: Hostinger's documented IMAP and SMTP settings
      responses:
        "200":
          description: Provider defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostingerDefaults"
  /accounts/test-all:
    post:
      operationId: testAllAccounts
      tags: [accounts]
      summary: Test every account's IMAP connection
      description: >-
        Runs the same check as `/accounts/{id}/test` across all live accounts, a
        few at a time. Individual failures are reported per account rather than
        failing the request, so one unreachable mailbox does not hide the rest.
      parameters:
        - name: provider
          in: query
          required: false
          description: Only test accounts of this provider.
          schema:
            $ref: "#/components/schemas/AccountProvider"
        - name: activeOnly
          in: query
          required: false
          description: Skip paused accounts. Defaults to false, so paused ones are tested too.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Per-account outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchTestResult"
  /accounts/scan-all:
    post:
      operationId: scanAllAccounts
      tags: [accounts]
      summary: Scan every active account now
      description: >-
        Runs the same scan the scheduler performs, on demand. Paused accounts are
        always skipped, because pausing is an instruction not to poll. An account
        already being scanned reuses that in-flight scan rather than duplicating
        work.
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountProvider"
      responses:
        "200":
          description: Per-account outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchScanResult"

  /accounts/delete-bulk:
    post:
      operationId: deleteAccountsBulk
      tags: [accounts]
      summary: Remove several accounts at once
      description: >-
        Soft-deletes each account, exactly as `DELETE /accounts/{id}` does, so all
        matched and archived messages are retained and stay attributable.

        POST rather than DELETE with a body: request bodies on DELETE are widely
        dropped by proxies and are not reliably readable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountsBulkBody"
      responses:
        "200":
          description: Which ids were removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteResult"

  /accounts/{id}:
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Update an email account (credentials, endpoints, or active state)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountBody"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAccount"
        "404":
          description: Account not found
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Remove an email account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /accounts/{id}/test:
    post:
      operationId: testAccount
      tags: [accounts]
      summary: Test the IMAP connection for an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResult"
  /accounts/{id}/scan:
    post:
      operationId: scanAccount
      tags: [accounts]
      summary: Manually trigger an inbox scan for matching emails
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
  /accounts/{id}/discover-host:
    post:
      operationId: discoverAccountHost
      tags: [accounts]
      summary: Look up the account's real mail server and repair its settings
      description: >-
        Resolves the account domain's MX records, probes the conventional
        hostnames and the MX hosts for a live IMAP/SMTP greeting, and writes
        back whichever endpoint answers first. This is the automatic remedy
        for a wrong `mail.<domain>` guess — ENOTFOUND, a refused port, a silent
        timeout. Stored progress marks are dropped when the IMAP endpoint
        changes, so the next scan takes a fresh first-scan window; history is
        untouched. Hostinger accounts are refused, because their servers are
        preset and an MX host is not the mailbox server.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: What discovery found and what was applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverHostResult"
        "404":
          description: Account not found

  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List matched messages (newest first)
      parameters:
        - name: accountId
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          description: >-
            Case-insensitive substring match against subject, sender,
            recipient, snippet, and the plain-text body.
          schema:
            type: string
        - name: receivedFrom
          in: query
          required: false
          description: Only messages received at or after this ISO timestamp.
          schema:
            type: string
        - name: receivedTo
          in: query
          required: false
          description: Only messages received at or before this ISO timestamp.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Matched messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchedMessage"
  /messages/export:
    post:
      operationId: exportMessages
      tags: [messages]
      summary: Export matched messages to JSON with full bodies
      description: >-
        Exports the whole email — metadata, keywords, and the complete text and
        HTML bodies — as a JSON array. Select either explicit `ids` (what was
        ticked) or the same filters the list accepts (what was searched), so
        every match for a keyword can be exported in one request regardless of
        pagination.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportMessagesBody"
      responses:
        "200":
          description: Full messages, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageDetail"
  /messages/ids:
    post:
      operationId: listMessageIds
      tags: [messages]
      summary: Ids of every message matching the current filters
      description: >-
        Powers "select all matching" across pages: a search can span many
        pages, and ticking each page by hand is not a workflow. Accepts the
        same filters as the list endpoint and returns the matching ids,
        newest first, capped at 2000 with a truncation flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListMessageIdsBody"
      responses:
        "200":
          description: Matching ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectedIdsResult"
  /messages/delete-bulk:
    post:
      operationId: deleteMessagesBulk
      tags: [messages]
      summary: Delete several matched messages at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMessagesBulkBody"
      responses:
        "200":
          description: Which ids were deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteResult"
  /messages/{id}:
    get:
      operationId: getMessage
      tags: [messages]
      summary: One matched message, including its full body
      description: >-
        Bodies are excluded from the list endpoint because they are large; fetch
        them one message at a time.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDetail"
        "404":
          description: Not found
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Delete a matched message from history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /inbox:
    get:
      operationId: listInboxMessages
      tags: [inbox]
      summary: List archived mail from unfiltered mailboxes (newest first)
      description: >-
        Every message seen in a mailbox whose capture mode is `all`, with no
        keyword test applied. Separate from `/messages`, which is the keyword
        triage queue.
      parameters:
        - name: accountId
          in: query
          required: false
          schema:
            type: integer
        - name: provider
          in: query
          required: false
          description: Restrict to mailboxes of one provider.
          schema:
            $ref: "#/components/schemas/AccountProvider"
        - name: search
          in: query
          required: false
          description: >-
            Case-insensitive substring match against subject, sender,
            recipient, snippet, and the plain-text body. Ad-hoc lookup, not a
            stored keyword.
          schema:
            type: string
        - name: receivedFrom
          in: query
          required: false
          description: Only messages received at or after this ISO timestamp.
          schema:
            type: string
        - name: receivedTo
          in: query
          required: false
          description: Only messages received at or before this ISO timestamp.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Archived messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxMessage"
  /inbox/export:
    post:
      operationId: exportInboxMessages
      tags: [inbox]
      summary: Export archived messages to JSON with full bodies
      description: >-
        Exports the whole email — metadata and the complete text and HTML
        bodies — as a JSON array. Select either explicit `ids` or the same
        filters the list accepts, so every search match can be exported in one
        request regardless of pagination.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportInboxMessagesBody"
      responses:
        "200":
          description: Full messages, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageDetail"
  /inbox/ids:
    post:
      operationId: listInboxMessageIds
      tags: [inbox]
      summary: Ids of every archived message matching the current filters
      description: >-
        Powers "select all matching" across pages for the archive; same
        policy as /messages/ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListInboxMessageIdsBody"
      responses:
        "200":
          description: Matching ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectedIdsResult"
  /inbox/delete-bulk:
    post:
      operationId: deleteInboxMessagesBulk
      tags: [inbox]
      summary: Delete several archived messages at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteInboxMessagesBulkBody"
      responses:
        "200":
          description: Which ids were deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteResult"
  /inbox/{id}:
    get:
      operationId: getInboxMessage
      tags: [inbox]
      summary: One archived message, including its full body
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDetail"
        "404":
          description: Not found
    delete:
      operationId: deleteInboxMessage
      tags: [inbox]
      summary: Delete an archived message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get current settings (keywords, forward destination)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsBody"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
  /settings/telegram-test:
    post:
      operationId: testTelegram
      tags: [settings]
      summary: Send a test Telegram message with the stored configuration
      description: >-
        Verifies the bot token and chat id by delivering one message, so a
        typo surfaces during setup rather than when a critical match fails to
        arrive.
      responses:
        "200":
          description: Delivery outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResult"

  /view/{token}:
    get:
      operationId: getViewMessage
      tags: [messages]
      summary: One stored message by signed, expiring link
      description: >-
        Telegram alerts carry a link here so a critical match can be opened
        without a session. The token is an HMAC over the message id and an
        expiry, signed with the app's session key material: it cannot be
        forged or enumerated, it expires on its own (30 days), and changing
        the app password invalidates it. It grants exactly one message and
        nothing else.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDetail"
        "404":
          description: Link invalid or expired, or the message no longer stored

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Dashboard summary stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"
  /stats/keyword-breakdown:
    get:
      operationId: getKeywordBreakdown
      tags: [stats]
      summary: Counts of matches per keyword
      responses:
        "200":
          description: Keyword breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeywordCount"
  /stats/account-activity:
    get:
      operationId: getAccountActivity
      tags: [stats]
      summary: Match counts per account
      responses:
        "200":
          description: Account activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountActivity"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthSession:
      type: object
      properties:
        authenticated:
          type: boolean
        authRequired:
          description: >-
            False when the server has no password configured. The UI shows a
            setup warning instead of a login form in that case.
          type: boolean
      required:
        - authenticated
        - authRequired

    LoginBody:
      type: object
      properties:
        password:
          type: string
          minLength: 1
      required:
        - password

    AccountProvider:
      description: >-
        Where an account's server settings came from. Provenance only: scanning
        and forwarding treat every account identically.
      type: string
      enum:
        - generic
        - hostinger

    CaptureMode:
      description: >-
        What a scan stores. `keywords` (webmail triage): subject, sender,
        recipient, and body are tested against the configured keywords; matches
        go to the Messages queue and are forwarded if forwarding is on, and
        critical keywords additionally push Telegram. `all` (Hostinger
        mailboxes): every message is archived into the Hostinger Inbox tab,
        never into the Messages queue — only the critical list runs, and only
        to decide whether to push Telegram. Forwarding never happens for `all`
        mailboxes, because relaying every arriving email would be a mail loop.
      type: string
      enum:
        - keywords
        - all

    HostingerDefaults:
      type: object
      properties:
        imapHost:
          type: string
        imapPort:
          type: integer
        imapSecure:
          type: boolean
        smtpHost:
          type: string
        smtpPortSsl:
          type: integer
        smtpPortStartTls:
          type: integer
      required:
        - imapHost
        - imapPort
        - imapSecure
        - smtpHost
        - smtpPortSsl
        - smtpPortStartTls

    EmailAccount:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        emailAddress:
          type: string
        provider:
          $ref: "#/components/schemas/AccountProvider"
        captureMode:
          $ref: "#/components/schemas/CaptureMode"
        imapHost:
          type: string
        imapPort:
          type: integer
        imapSecure:
          type: boolean
        smtpHost:
          type: string
        smtpPort:
          type: integer
        smtpSecure:
          type: boolean
        username:
          type: string
        allowInvalidCert:
          description: >-
            Accept a TLS certificate that does not match the hostname. Needed for
            shared cPanel hosting that serves the provider's certificate on
            mail.<domain>.
          type: boolean
        active:
          type: boolean
        lastCheckedAt:
          type: string
          nullable: true
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - label
        - emailAddress
        - provider
        - captureMode
        - imapHost
        - imapPort
        - imapSecure
        - smtpHost
        - smtpPort
        - smtpSecure
        - username
        - allowInvalidCert
        - active
        - createdAt

    CreateHostingerAccountsBody:
      description: >-
        Hostinger mailboxes to monitor. IMAP and SMTP settings come from
        Hostinger's defaults, so only mailboxes and passwords are supplied.
      type: object
      properties:
        mailboxes:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/HostingerMailbox"
        password:
          description: >-
            Fallback password used for any mailbox that does not carry its own.
            Required unless every mailbox supplies a password.
          type: string
          minLength: 1
        smtpMode:
          description: >-
            SSL on port 465 (Hostinger's default) or STARTTLS on port 587, which
            Hostinger documents as the fallback when 465 is blocked.
          type: string
          enum:
            - ssl
            - starttls
          default: ssl
        captureMode:
          description: >-
            Defaults to `all` for Hostinger mailboxes: every arriving message is
            archived into /inbox unfiltered. Set `keywords` to put a mailbox into
            the keyword triage queue instead.
          allOf:
            - $ref: "#/components/schemas/CaptureMode"
          default: all
        allowInvalidCert:
          description: >-
            Accept a TLS certificate that does not match the hostname. Not
            normally needed for Hostinger, whose certificates are valid.
          type: boolean
          default: false
      required:
        - mailboxes

    HostingerMailbox:
      type: object
      properties:
        emailAddress:
          type: string
          format: email
        password:
          description: Overrides the shared password for this mailbox only.
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
      required:
        - emailAddress

    CreateAccountBody:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        emailAddress:
          type: string
          format: email
        imapHost:
          type: string
          minLength: 1
        imapPort:
          type: integer
          default: 993
        imapSecure:
          type: boolean
          default: true
        smtpHost:
          type: string
          minLength: 1
        smtpPort:
          type: integer
          default: 465
        smtpSecure:
          type: boolean
          default: true
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        allowInvalidCert:
          description: >-
            Accept a TLS certificate that does not match the hostname. Enable only
            when the server presents a mismatched certificate, as shared cPanel
            hosting commonly does.
          type: boolean
          default: false
      required:
        - label
        - emailAddress
        - imapHost
        - smtpHost
        - username
        - password

    UpdateAccountBody:
      description: >-
        Partial update. Only the supplied fields are changed. Omit `password`
        to keep the stored credential unchanged.
      type: object
      properties:
        label:
          type: string
          minLength: 1
        emailAddress:
          type: string
          format: email
        imapHost:
          type: string
          minLength: 1
        imapPort:
          type: integer
        imapSecure:
          type: boolean
        smtpHost:
          type: string
          minLength: 1
        smtpPort:
          type: integer
        smtpSecure:
          type: boolean
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        active:
          type: boolean
        allowInvalidCert:
          type: boolean
        captureMode:
          $ref: "#/components/schemas/CaptureMode"

    BulkCreateAccountsBody:
      description: >-
        Create many accounts in one request.

        Server settings default to `mail.<domain>` derived from each address, so a
        batch spanning several domains works without naming a host. Supply
        `imapHost`/`smtpHost` to force one server for the whole batch instead.

        Passwords work the same way: a mailbox may carry its own, or fall back to
        the batch-level `password`. Whatever a mailbox does not specify — label,
        username — defaults to its address.
      type: object
      properties:
        accounts:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/BulkAccountEntry"
        password:
          description: >-
            Fallback password for any mailbox that does not carry its own.
            Required unless every mailbox supplies a password.
          type: string
          minLength: 1
        imapHost:
          description: >-
            Applies to every mailbox in the batch. Omit to look up each
            domain's real mail server automatically (MX records and a live
            probe), falling back to `mail.<domain>`.
          type: string
          minLength: 1
        imapPort:
          description: >-
            Omit along with `imapHost` to take the port a discovered server
            actually answered on; the conventional default is 993.
          type: integer
        imapSecure:
          type: boolean
        smtpHost:
          description: >-
            Applies to every mailbox in the batch. Omit to look up each
            domain's real mail server automatically, falling back to
            `mail.<domain>`.
          type: string
          minLength: 1
        smtpPort:
          type: integer
        smtpSecure:
          type: boolean
        allowInvalidCert:
          description: >-
            Applies to every mailbox in the batch. Shared cPanel hosting commonly
            serves a certificate that does not match mail.<domain>.
          type: boolean
          default: false
      required:
        - accounts

    BulkAccountEntry:
      type: object
      properties:
        emailAddress:
          type: string
          format: email
        password:
          description: Overrides the batch password for this mailbox only.
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
      required:
        - emailAddress

    BulkCreateResult:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: "#/components/schemas/EmailAccount"
        failed:
          type: array
          items:
            $ref: "#/components/schemas/BulkCreateFailure"
      required:
        - created
        - failed

    BulkCreateFailure:
      type: object
      properties:
        emailAddress:
          type: string
        reason:
          type: string
      required:
        - emailAddress
        - reason

    TestResult:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
      required:
        - ok
        - message

    ScanResult:
      type: object
      properties:
        scanned:
          type: integer
        matched:
          description: >-
            Keyword matches stored into the Messages queue, which only a
            `keywords` mailbox writes. An `all` mailbox archives instead and
            reports 0 here.
          type: integer
        archived:
          description: Messages archived, for an `all` mailbox.
          type: integer
        forwarded:
          type: integer
        notified:
          description: Critical matches successfully pushed to Telegram.
          type: integer
        message:
          type: string
      required:
        - scanned
        - matched
        - archived
        - forwarded
        - notified
        - message

    MatchedMessage:
      type: object
      properties:
        id:
          type: integer
        accountId:
          type: integer
        accountLabel:
          description: >-
            Account label as captured when the message was matched. Unchanged by
            later renames or account removal.
          type: string
        accountEmail:
          description: Account address as captured when the message was matched.
          type: string
        accountDeleted:
          description: True when the originating account has since been removed.
          type: boolean
        messageUid:
          type: string
        folder:
          description: >-
            IMAP folder the message was read from, such as INBOX or Junk.
            A message found outside INBOX has the folder prefixed into
            messageUid as well, so the two always agree.
          type: string
        messageId:
          type: string
          nullable: true
        fromAddress:
          type: string
        toAddress:
          type: string
        subject:
          type: string
        snippet:
          type: string
        receivedAt:
          type: string
        matchedKeywords:
          type: array
          items:
            type: string
        forwarded:
          type: boolean
        forwardError:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - accountId
        - accountLabel
        - accountEmail
        - accountDeleted
        - messageUid
        - folder
        - fromAddress
        - toAddress
        - subject
        - snippet
        - receivedAt
        - matchedKeywords
        - forwarded
        - createdAt

    InboxMessage:
      description: >-
        An archived message from an unfiltered mailbox. Has no keyword or
        forwarding fields: nothing was matched and nothing was relayed.
      type: object
      properties:
        id:
          type: integer
        accountId:
          type: integer
        accountLabel:
          description: >-
            Account label as captured when the message was archived. Unchanged by
            later renames or account removal.
          type: string
        accountEmail:
          description: Account address as captured when the message was archived.
          type: string
        accountDeleted:
          description: True when the originating account has since been removed.
          type: boolean
        messageUid:
          type: string
        folder:
          description: IMAP folder the message was read from, such as INBOX or Junk.
          type: string
        messageId:
          type: string
          nullable: true
        fromAddress:
          type: string
        toAddress:
          type: string
        subject:
          type: string
        snippet:
          type: string
        receivedAt:
          type: string
        createdAt:
          type: string
      required:
        - id
        - accountId
        - accountLabel
        - accountEmail
        - accountDeleted
        - messageUid
        - folder
        - fromAddress
        - toAddress
        - subject
        - snippet
        - receivedAt
        - createdAt

    MessageDetail:
      description: >-
        A single captured email with its full body. Shared by /messages/{id} and
        /inbox/{id}: keyword fields are present only for a keyword match.
      type: object
      properties:
        id:
          type: integer
        accountId:
          type: integer
        accountLabel:
          description: >-
            Account label as captured at the time. Unchanged by later renames or
            account removal.
          type: string
        accountEmail:
          type: string
        accountDeleted:
          type: boolean
        messageUid:
          type: string
        folder:
          description: IMAP folder the message was read from, such as INBOX or Junk.
          type: string
        messageId:
          type: string
          nullable: true
        fromAddress:
          type: string
        toAddress:
          type: string
        subject:
          type: string
        snippet:
          type: string
        bodyText:
          description: Full plain-text body, or null when the message had none.
          type: string
          nullable: true
        bodyHtml:
          description: >-
            Full HTML body, or null. Untrusted: render only in a sandboxed frame,
            never inline.
          type: string
          nullable: true
        bodyTruncated:
          description: True when the stored body was cut at the size cap.
          type: boolean
        receivedAt:
          type: string
        createdAt:
          type: string
        matchedKeywords:
          description: Present only for a keyword-matched message.
          type: array
          items:
            type: string
        forwarded:
          type: boolean
        forwardError:
          type: string
          nullable: true
      required:
        - id
        - accountId
        - accountLabel
        - accountEmail
        - accountDeleted
        - messageUid
        - folder
        - fromAddress
        - toAddress
        - subject
        - snippet
        - bodyTruncated
        - receivedAt
        - createdAt

    BatchTestResult:
      type: object
      properties:
        tested:
          description: How many accounts were attempted.
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/AccountTestOutcome"
      required:
        - tested
        - succeeded
        - failed
        - results

    AccountTestOutcome:
      type: object
      properties:
        accountId:
          type: integer
        label:
          type: string
        emailAddress:
          type: string
        ok:
          type: boolean
        message:
          type: string
      required:
        - accountId
        - label
        - emailAddress
        - ok
        - message

    BatchScanResult:
      type: object
      properties:
        scannedAccounts:
          description: How many accounts were scanned.
          type: integer
        skipped:
          description: Paused accounts, which are never polled.
          type: integer
        totalMatched:
          type: integer
        totalArchived:
          type: integer
        totalForwarded:
          type: integer
        totalNotified:
          description: Critical matches pushed to Telegram across the batch.
          type: integer
        failed:
          description: Accounts whose scan reported a failure.
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/AccountScanOutcome"
      required:
        - scannedAccounts
        - skipped
        - totalMatched
        - totalArchived
        - totalForwarded
        - totalNotified
        - failed
        - results

    AccountScanOutcome:
      type: object
      properties:
        accountId:
          type: integer
        label:
          type: string
        emailAddress:
          type: string
        ok:
          description: False when the scan reported a failure for this account.
          type: boolean
        scanned:
          type: integer
        matched:
          type: integer
        archived:
          type: integer
        forwarded:
          type: integer
        notified:
          description: Critical matches pushed to Telegram for this account.
          type: integer
        message:
          type: string
      required:
        - accountId
        - label
        - emailAddress
        - ok
        - scanned
        - matched
        - archived
        - forwarded
        - notified
        - message

    DeleteAccountsBulkBody:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: integer
      required:
        - ids

    BulkDeleteResult:
      type: object
      properties:
        deleted:
          description: Ids that were live and are now removed.
          type: array
          items:
            type: integer
        notFound:
          description: >-
            Ids that did not match a live account, because they never existed or
            were already removed. Reported rather than treated as an error, since
            the end state is the one that was asked for.
          type: array
          items:
            type: integer
      required:
        - deleted
        - notFound

    DeleteMessagesBulkBody:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            type: integer
      required:
        - ids

    DeleteInboxMessagesBulkBody:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            type: integer
      required:
        - ids

    ExportMessagesBody:
      description: >-
        What to export: explicit `ids` (what was ticked) or, when ids are
        omitted, every message matching the same filters the list endpoint
        accepts (what was searched). Omitting both exports everything.
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            type: integer
        accountId:
          type: integer
        search:
          type: string
        receivedFrom:
          type: string
        receivedTo:
          type: string

    ExportInboxMessagesBody:
      description: Same selection policy as ExportMessagesBody, for the archive.
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            type: integer
        accountId:
          type: integer
        provider:
          $ref: "#/components/schemas/AccountProvider"
        search:
          type: string
        receivedFrom:
          type: string
        receivedTo:
          type: string

    ListMessageIdsBody:
      description: >-
        Which messages to select: every match for these filters, the same ones
        the list endpoint accepts.
      type: object
      properties:
        accountId:
          type: integer
        search:
          type: string
        receivedFrom:
          type: string
        receivedTo:
          type: string

    ListInboxMessageIdsBody:
      description: Same filters as ListMessageIdsBody, for the archive.
      type: object
      properties:
        accountId:
          type: integer
        provider:
          $ref: "#/components/schemas/AccountProvider"
        search:
          type: string
        receivedFrom:
          type: string
        receivedTo:
          type: string

    SelectedIdsResult:
      type: object
      properties:
        ids:
          description: >-
            Every matching message id, newest first, so "select all matching"
            spans pages without loading any of them.
          type: array
          items:
            type: integer
        truncated:
          description: >-
            True when matches exist beyond the selection cap of 2000 — the
            ids cover the newest 2000.
          type: boolean
      required:
        - ids
        - truncated

    DiscoverHostResult:
      type: object
      properties:
        ok:
          description: >-
            True when a server was found and applied, or when discovery agrees
            with the stored settings. False when nothing answered or the account
            is not discoverable (Hostinger).
          type: boolean
        imapFound:
          type: boolean
        smtpFound:
          type: boolean
        updated:
          description: >-
            The account after the repair, or null when nothing was applied.
            Credentials are never included.
          allOf:
            - $ref: "#/components/schemas/EmailAccount"
          nullable: true
        message:
          description: What was found and what was applied.
          type: string
      required:
        - ok
        - imapFound
        - smtpFound
        - message

    AppSettings:
      type: object
      properties:
        keywords:
          type: array
          items:
            type: string
        criticalKeywords:
          description: >-
            The short list worth interrupting for: a match also pushes a
            Telegram message with the whole email and a link to its exact web
            view.
          type: array
          items:
            type: string
        forwardToEmail:
          type: string
          nullable: true
        pollIntervalSeconds:
          type: integer
        forwardingEnabled:
          type: boolean
        telegramEnabled:
          description: Push Telegram alerts for critical matches.
          type: boolean
        telegramBotTokenSet:
          description: >-
            True when a bot token is stored. The token itself is never
            returned; send a new one to replace it, and note that every other
            settings client sends `telegramBotToken` only when replacing it.
          type: boolean
        telegramChatId:
          description: The chat that receives the alerts.
          type: string
          nullable: true
        appUrl:
          description: >-
            The public address of this app, used to build the web-view links
            inside Telegram alerts. Falls back to RENDER_EXTERNAL_URL when
            unset.
          type: string
          nullable: true
        retainBodiesDays:
          description: >-
            Drop stored message bodies older than this many days, keeping the row
            and its snippet. 0 keeps them forever.
          type: integer
        retainMessagesDays:
          description: >-
            Delete messages older than this many days outright. 0 keeps them
            forever.
          type: integer
      required:
        - keywords
        - criticalKeywords
        - pollIntervalSeconds
        - forwardingEnabled
        - telegramEnabled
        - telegramBotTokenSet
        - retainBodiesDays
        - retainMessagesDays

    UpdateSettingsBody:
      type: object
      properties:
        keywords:
          type: array
          items:
            type: string
        criticalKeywords:
          type: array
          items:
            type: string
        forwardToEmail:
          type: string
          nullable: true
        pollIntervalSeconds:
          type: integer
          minimum: 30
        forwardingEnabled:
          type: boolean
        telegramEnabled:
          type: boolean
        telegramBotToken:
          description: >-
            The bot token from @BotFather. Omit to keep the stored one; send
            an empty string to remove it.
          type: string
        telegramChatId:
          type: string
          nullable: true
        appUrl:
          type: string
          nullable: true
        retainBodiesDays:
          type: integer
          minimum: 0
          maximum: 3650
        retainMessagesDays:
          type: integer
          minimum: 0
          maximum: 3650

    StatsSummary:
      type: object
      properties:
        totalAccounts:
          type: integer
        activeAccounts:
          type: integer
        totalMatches:
          type: integer
        matchesLast24h:
          type: integer
        matchesLast7d:
          type: integer
        forwardedCount:
          type: integer
        archivedTotal:
          description: Messages archived from unfiltered mailboxes.
          type: integer
        archivedLast24h:
          type: integer
        databaseBytes:
          description: >-
            Current database size, for watching a hosted free-tier quota. Null
            when the host does not permit reading it.
          type: integer
          nullable: true
        heartbeatDay:
          description: >-
            The date currently recorded by the daily liveness beat (YYYY-MM-DD),
            or null before the first beat.
          type: string
          nullable: true
      required:
        - totalAccounts
        - activeAccounts
        - totalMatches
        - matchesLast24h
        - matchesLast7d
        - forwardedCount
        - archivedTotal
        - archivedLast24h

    KeywordCount:
      type: object
      properties:
        keyword:
          type: string
        count:
          type: integer
      required:
        - keyword
        - count

    AccountActivity:
      type: object
      properties:
        accountId:
          type: integer
        label:
          type: string
        emailAddress:
          type: string
        matchCount:
          type: integer
        lastMatchAt:
          type: string
          nullable: true
      required:
        - accountId
        - label
        - emailAddress
        - matchCount
